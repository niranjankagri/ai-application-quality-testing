# Real model checks: the Ollama suite and the red team. They are kept out of the required check
# because a model's answers and grades can vary. A red result here is a finding to review.
name: Local model evaluations

on:
  pull_request:
    branches: [main]
    paths:
      - "promptfooconfig.ollama.yaml"
      - "promptfooconfig.redteam.yaml"
      - "ollama_provider.py"
      - "src/**"
      - "data/knowledge_base.json"
      - ".github/workflows/model-evals.yml"
  schedule:
    - cron: '55 23 * * 5'   # Friday 23:55 UTC
  workflow_dispatch:

concurrency:
  group: model-evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODEL: llama3.2:3b
  # Grades the answers; the 3b model was not reliable as a grader
  GRADER_MODEL: qwen2.5:7b
  # Keeps attack generation on the runner
  PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: "true"
  # Ends one stuck test after 5 minutes instead of letting it use the whole step timeout
  # (on 7 and 14 Nov a red-team test hung until the 30-minute step limit)
  PROMPTFOO_EVAL_TIMEOUT_MS: "300000"

jobs:
  evaluate:
    name: Ollama evaluations and red team
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama:0.40.15
        ports:
          - 11434:11434
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm ci

      - name: Pull the models
        run: |
          for m in "$MODEL" "$GRADER_MODEL"; do
            curl --fail --silent --show-error http://localhost:11434/api/pull -d "{\"model\":\"$m\",\"stream\":false}"
          done

      # One request at a time: the CPU runner serves one model call at a time, and parallel calls
      # queue until the provider's 120 s timeout ends them
      - name: Run the Ollama evaluations
        timeout-minutes: 15
        run: npx promptfoo eval --no-share --max-concurrency 1 -c promptfooconfig.ollama.yaml -o model-eval-results.json

      # The attacks go to their own file. `redteam run --output redteam.yaml` wrote the eval results
      # over the generated tests, so they could not be run or graded again.
      - name: Generate the red-team attacks
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: npx promptfoo redteam generate --max-concurrency 1 -c promptfooconfig.redteam.yaml -o redteam-tests.yaml

      - name: Run the red team
        # Findings are for review, so they don't fail this step on their own
        if: ${{ !cancelled() && hashFiles('redteam-tests.yaml') != '' }}
        continue-on-error: true
        timeout-minutes: 20
        run: npx promptfoo redteam eval --no-share --max-concurrency 1 -c redteam-tests.yaml -o redteam-results.json

      # The grader is not repeatable: on 21 Nov identical answers passed in one run and failed in the
      # next. Each failed answer is graded again with the answer replayed from the first pass (not
      # asked again), and --no-cache makes the grader decide afresh instead of reusing its verdict.
      - name: Grade the failed red-team answers again
        if: ${{ !cancelled() && hashFiles('redteam-results.json') != '' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          REDTEAM_REPLAY_FILE: redteam-results.json
        run: |
          failed=$(python -m ai_quality_lab.redteam_regrade failed-count redteam-results.json)
          echo "The first grade failed $failed probe(s)"
          if [ "$failed" -gt 0 ]; then
            # Exits non-zero when a probe fails again; the next step decides what that means
            npx promptfoo redteam eval --no-share --no-cache --max-concurrency 1 -c redteam-tests.yaml \
              --filter-failing redteam-results.json -o redteam-regrade.json || true
          fi

      - name: Confirm the red-team findings
        # A probe fails only when both grades fail it; the table goes to the job summary
        if: ${{ !cancelled() && hashFiles('redteam-results.json') != '' }}
        continue-on-error: true
        run: >-
          python -m ai_quality_lab.redteam_regrade confirm redteam-results.json redteam-regrade.json
          --output redteam-confirmed.json

      - name: Save the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: model-eval-results
          path: |
            model-eval-results.json
            redteam-tests.yaml
            redteam-results.json
            redteam-regrade.json
            redteam-confirmed.json
          if-no-files-found: warn

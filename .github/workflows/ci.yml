name: Quality checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, without a code change: a broken dependency shows up within a week
    - cron: '55 23 * * 5'   # Friday 23:55 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Unit tests and Promptfoo evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install the pinned Promptfoo
        run: npm ci

      - name: Run component tests
        run: python -m pytest

      - name: Run retrieval quality evaluation
        run: python -m ai_quality_lab.retrieval_eval --min-recall-at-1 0.9 --min-no-answer-accuracy 1.0

      - name: Run deterministic Promptfoo evaluations
        run: npx promptfoo eval --no-share -c promptfooconfig.yaml

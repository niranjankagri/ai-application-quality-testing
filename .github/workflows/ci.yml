name: Quality checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluate:
    name: Unit tests and Promptfoo evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run component tests
        run: python -m pytest

      - name: Run deterministic Promptfoo evaluations
        run: npx --yes promptfoo@latest eval --ci -c promptfooconfig.yaml
